[project]
name = "WG-Bridge"
version = "0.0.0"
description = "Simplified Wireguard VPN manager"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-or-later"}  

dependencies = [
    "wireguard-tools",
    "pyroute2",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "isort",
    "pyright",
    "pytest",
    "pytest-cov",
    "pre-commit",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/MoonyFringers/wg-bridge.git"
Issues = "https://github.com/MoonyFringers/wg-bridge/issues"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

# ----------------------------------------
# BLACK
# ----------------------------------------
[tool.black]
line-length = 80
target-version = ['py312']
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
# As this is 'extend', we already exclude everything in .gitignore.
^/(
  (
    resources
  )/
)
'''

# ----------------------------------------
# ISORT
# ----------------------------------------
[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 80
extend_skip_glob = ["resources/*"]

# ----------------------------------------
# RUFF
# ----------------------------------------
[tool.ruff]
line-length = 80
select = ["E", "F", "W", "B"]
ignore = [
    "E501"  # Handled by Black
]
respect-gitignore = true
extend-exclude = [
    "resources/*"
]

# ----------------------------------------
# PYRIGHT
# ----------------------------------------
[tool.pyright]
typeCheckingMode = "strict"
venvPath = ".."
venv = ".venv"

[tool.setuptools.packages.find]
where = ["src"]
